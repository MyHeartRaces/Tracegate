worker_processes auto;
pid /run/tracegate-nginx-entry.pid;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  server {
    listen 127.0.0.1:10443 ssl http2;
    listen 127.0.0.1:443 ssl http2;
    # Source-gated Telemt camouflage endpoint. The Endpoint is the only remote
    # source allowed to reach this listener through the private nftables overlay.
    listen REPLACE_ENTRY_BIND_HOST:10444 ssl http2;
    server_name REPLACE_TLS_SERVER_NAME;

    ssl_certificate     /etc/tracegate/tls/ws.crt;
    ssl_certificate_key /etc/tracegate/tls/ws.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TracegateEntryTLS:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/decoy;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
