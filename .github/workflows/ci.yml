name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -c requirements.lock
          python -m pip check

      - name: Start isolated PostgreSQL compatibility cluster
        run: |
          TG_PG_BIN=$(pg_config --bindir)
          TG_PG_ROOT="$RUNNER_TEMP/tracegate-postgres"
          mkdir -p "$TG_PG_ROOT/socket"
          "$TG_PG_BIN/initdb" -D "$TG_PG_ROOT/data" --encoding=UTF8 --no-locale --auth-local=peer --auth-host=reject
          "$TG_PG_BIN/pg_ctl" -D "$TG_PG_ROOT/data" -l "$TG_PG_ROOT/postgres.log" \
            -o "-F -k $TG_PG_ROOT/socket -c listen_addresses=''" -w start
          echo "TRACEGATE_TEST_POSTGRES_URL=postgresql+psycopg:///postgres?host=$TG_PG_ROOT/socket" >> "$GITHUB_ENV"

      - name: Full release checks
        run: make release-check

      - name: Build and inspect release artifacts
        if: matrix.python-version == '3.12'
        run: |
          VERSION=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          scripts/build_release_artifacts.sh "$VERSION"

      - name: Clean-room native host install
        if: matrix.python-version == '3.12'
        run: |
          VERSION=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          ROOT=$(mktemp -d)
          tar -xzf "dist/release-v${VERSION}/tracegate-host-runtime-${VERSION}.tar.gz" -C "$ROOT"
          sudo env \
            TRACEGATE_INSTALL_ROOT="$ROOT/opt/tracegate" \
            TRACEGATE_SYSTEMD_DIR="$ROOT/etc/systemd" \
            TRACEGATE_SYSCTL_DIR="$ROOT/etc/sysctl.d" \
            TRACEGATE_LOCAL_SBIN_DIR="$ROOT/usr/local/sbin" \
            TRACEGATE_SYSTEMCTL=/bin/true \
            TRACEGATE_SYSCTL=/bin/true \
            "$ROOT/tracegate-host-runtime-${VERSION}/deploy/host/tracegate-host-install" "$VERSION"
          sudo "$ROOT/opt/tracegate/releases/${VERSION}/venv/bin/tracegate-host-private-preflight" --help >/dev/null

      - name: Upload inspected artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: tracegate-release-${{ github.sha }}
          path: dist/release-v*/
          if-no-files-found: error
          retention-days: 7

      - name: Stop PostgreSQL compatibility cluster
        if: always()
        run: |
          TG_PG_BIN=$(pg_config --bindir)
          TG_PG_DATA="$RUNNER_TEMP/tracegate-postgres/data"
          if test -f "$TG_PG_DATA/postmaster.pid"; then
            "$TG_PG_BIN/pg_ctl" -D "$TG_PG_DATA" -m fast -w stop
          fi

  runtime-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify updated runtime images start
        run: |
          docker run --rm docker.io/tobyxdd/hysteria:v2.13.0 version
          docker run --rm --entrypoint /bin/promtool prom/prometheus:v3.15.1 --version
          docker run --rm --entrypoint grafana grafana/grafana:13.2.4 --version
