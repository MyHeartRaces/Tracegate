# Hysteria 2 uses userspace QUIC and needs substantially larger UDP buffers
# than the Linux defaults. Apply the values to both newly created server and
# backhaul client sockets.
net.core.rmem_default = 16777216
net.core.rmem_max = 16777216
net.core.wmem_default = 16777216
net.core.wmem_max = 16777216

# The Entry/Endpoint path has occasional short loss bursts. BBR with the fair
# queueing scheduler keeps throughput and interactive latency from collapsing
# on random loss, while TCP MTU probing recovers from path-MTU black holes.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_mtu_probing = 1
